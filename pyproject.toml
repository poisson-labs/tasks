[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "poisson-tasks"
version = "0.3.1"
description = "Tool-use tasks with a known right answer, generated on your machine, and a card that says what each level of difficulty was worth to the model you ran."
readme = "README.md"
# An SPDX expression (PEP 639), so PyPI shows "MIT" and not the licence text; the two files are
# what the package has always shipped under dist-info/licenses/, LICENSE and the third-party NOTICE.
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
# The upper bound is verifiers 0.3.1's own, which this package pins.
requires-python = ">=3.11,<3.14"
authors = [{ name = "Poisson Labs", email = "work@poissonlabs.ai" }]
maintainers = [{ name = "Poisson Labs", email = "work@poissonlabs.ai" }]
keywords = ["tool-use", "evaluation", "benchmark", "reinforcement-learning", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Everything a plain install needs. Prove is not here: it is one of two output routes, so it is
# an optional extra below.
#
# Rich draws the command's output on a terminal, questionary draws init's menus, and
# prompt_toolkit reads the guided session's prompt; all three are ordinary dependencies, not an
# extra (decided 2026-10-13 and 2026-10-20). The floors were measured, not guessed: the pretty
# style's tests pass on Rich 11.0.0, the lowest version verifiers itself allows, and on 12.0.0,
# 12.6.0, 13.0.0, 13.4.2, 13.9.4, 14.0.0 and 15.0.0, but Rich draws a Markdown table as a table
# only from 13.4.2 (11.0.0 to 13.3.0 print the pipes as text), which the session's card view
# needs, so that is the floor; questionary 2.0.0, 2.0.1 and 2.1.0 fail to draw a menu beside
# the prompt_toolkit they install today (2.1.0 on prompt_toolkit 3.0.53: "'VSplit' object has no
# attribute 'content'"), and 2.1.1 works; prompt_toolkit 3.0.53 is the version measured, and
# declaring it adds no package, since questionary installs it.
dependencies = [
    "verifiers==0.3.1",
    "tiktoken==0.14.0",
    "pyyaml>=6.0",
    "rich>=13.4.2",
    "questionary>=2.1.1",
    "prompt_toolkit>=3.0.53",
]

[project.optional-dependencies]
# The Prove route. Prove is public on PyPI as `poisson-prove` (the package is `poisson_prove`), and
# `poisson_tasks.adapter` is the only module that needs it: nothing on `import poisson_tasks`'s
# path reaches that module, so a plain install works without it, and `pip install
# "poisson-tasks[prove]"` adds it. It is an extra, and not a dependency, because it is one of two
# output routes and brings its own scientific stack (numpy, pandas, scipy, pyarrow, textual).
#
# The floor was measured, not guessed: on 2026-11-03 the end-to-end check
# (scripts/release/prove_e2e.py) ran against each published version, with this tree's wheel
# installed beside `poisson-prove==X`. 0.1.0, 0.1.1 and 0.1.2 each passed all twenty checks; 0.0.1,
# the yanked name-hold, has no command and no Episode, and failed ten. 0.1.0 is the first release
# with what Tasks uses, so that is the floor. The ceiling is the next minor: Prove is 0.x, and what
# Tasks follows of its command line (the run id in `sweep --json`, the exit code of a target that
# cannot be resolved, the store's `.poisson` folder) is what a minor release can move, so a 0.2 is
# measured the same way, and the bound raised, in a release of its own.
prove = ["poisson-prove>=0.1.0,<0.2"]

# Floors, not pins: the suite, mypy --strict and the ruff rule set in this file are
# known green on these versions, and nothing below them is claimed. NOTICE names the
# exact versions each tool's quoted licence was read from.
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "ruff>=0.16.7",
    # The model B tests render the served model's chat template the way vLLM does, with
    # jinja2's sandbox. It used to arrive only through a dependency of `verifiers`, and the
    # tests that need it skipped where it did not.
    "jinja2>=3.1.6",
    # The wheel's own tests build it with hatchling directly, from the working tree.
    "hatchling>=1.27.0",
]

# The command: `poisson-tasks`, one script, seven verbs (`python -m poisson_tasks` is the same).
[project.scripts]
poisson-tasks = "poisson_tasks.cli:main"

# The name is settled: the tool is Poisson Tasks, the distribution is `poisson-tasks` and
# the repository is `poisson-labs/tasks`. These three URLs carry the repository name.
[project.urls]
Homepage = "https://github.com/poisson-labs/tasks"
Repository = "https://github.com/poisson-labs/tasks"
Issues = "https://github.com/poisson-labs/tasks/issues"

[tool.hatch.build.targets.wheel]
# `poisson_tasks_own` is the own-tools taskset's top-level module: verifiers 0.3.1 finds a
# taskset by a top-level module only (decided 2026-10-13).
packages = ["src/poisson_tasks", "src/poisson_tasks_own"]
# The encoding file is fetched after installation, never shipped: see NOTICE.
exclude = ["data/*.tiktoken"]

# The published cards ship as package data, `poisson_tasks/cards/<model folder>/`, built from the
# repository's `calibration/` folder, so the repository layout and its tests stay as they are.
# `poisson_tasks/cards.py` is a module of the same name: the data folder holds no
# Python file and no `__init__.py`, so the module wins the import, and a test holds it so
# (tests/test_fd6_wheel.py).
[tool.hatch.build.targets.wheel.force-include]
"calibration" = "poisson_tasks/cards"

[tool.hatch.build.targets.sdist]
exclude = ["src/poisson_tasks/data/*.tiktoken"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I", "E501", "E702", "B905"]
# The release checks (docs/releasing.md) are scripts run by hand, one per step, not package code.
"scripts/release/*" = ["E501", "E731", "E741"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

# tiktoken_ext is tiktoken's plugin namespace package and carries no py.typed marker,
# unlike tiktoken itself. fetch_encoding reads the o200k_base constructor out of it.
[[tool.mypy.overrides]]
module = ["tiktoken_ext.*"]
ignore_missing_imports = true

# verifiers ships no py.typed marker, so mypy reads nothing from the wheel and every
# `vf` name is Any. The export subclasses seven of them, which strict mode refuses on its
# own (`disallow_subclassing_any`); the module's own signatures are checked as usual, and
# the wheel's names are pinned by X1's CI test instead (the tests import each one from the
# pinned 0.3.1 wheel).
[[tool.mypy.overrides]]
module = ["verifiers", "verifiers.*"]
ignore_missing_imports = true

# `poisson_tasks.taskset` is the same case as the export and for the same reason: its env
# config and its env subclass two more of the wheel's Any names. It declares no rewards, so
# it needs no decorator exemption.
[[tool.mypy.overrides]]
module = ["poisson_tasks.export", "poisson_tasks.taskset", "poisson_tasks.own.export"]
disallow_subclassing_any = false
disallow_untyped_decorators = false

# poisson_prove is the optional extra, so `mypy` over a plain install has nothing to read and
# would fail on adapter.py's import alone. This silences that one error and nothing else:
# where the extra IS installed, Prove ships py.typed and mypy checks the adapter
# against the real types, which is the configuration the gate is run in.
[[tool.mypy.overrides]]
module = ["poisson_prove"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Some tests import others as `tests.<module>`, which needs the repository root on the import
# path. `python -m pytest` puts it there and a bare `pytest` does not; this does, for both.
pythonpath = ["."]
