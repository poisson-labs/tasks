[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-generator"
version = "0.0.1"
description = "A deterministic generator of tool-use tasks over one mock stateful domain, each generated with its verifier."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Poisson Labs", email = "work@poissonlabs.ai" }]
maintainers = [{ name = "Poisson Labs", email = "work@poissonlabs.ai" }]
keywords = ["tool-use", "evaluation", "benchmark", "reinforcement-learning", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
# Everything a plain install needs. Proofload is not here: it is one of two output
# routes and it is not public, so it is an optional extra below.
dependencies = ["verifiers==0.3.1", "tiktoken==0.14.0"]

[project.optional-dependencies]
# The Proofload route. Proofload core is first party and not published anywhere, so
# this extra resolves only when a checkout is already installed into the same
# environment (`pip install -e ../proofload` first); the exact pin keeps pip off the
# 0.0.0 name-hold on PyPI. Nothing outside `task_generator.adapter`, the third example
# and `tests/test_tg_m5_scripted.py` needs it.
proofload = ["proofload==0.0.1"]

# Floors, not pins: the suite, mypy --strict and the ruff rule set in this file are
# known green on these versions, and nothing below them is claimed. NOTICE names the
# exact versions each tool's quoted licence was read from.
dev = [
    "pytest>=9.1.1",
    "hypothesis>=6.168.0",
    "mypy>=2.3.1",
    "ruff>=0.16.7",
]

# The repository is named for the working label and will move when the name is
# settled; these three URLs are the one place that has to change with it.
[project.urls]
Homepage = "https://github.com/poisson-labs/task-generator"
Repository = "https://github.com/poisson-labs/task-generator"
Issues = "https://github.com/poisson-labs/task-generator/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/task_generator"]
# The encoding file is fetched after installation, never shipped: see NOTICE.
exclude = ["data/*.tiktoken"]

[tool.hatch.build.targets.sdist]
exclude = ["src/task_generator/data/*.tiktoken"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I", "E501", "E702", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

# tiktoken_ext is tiktoken's plugin namespace package and carries no py.typed marker,
# unlike tiktoken itself. fetch_encoding reads the o200k_base constructor out of it.
[[tool.mypy.overrides]]
module = ["tiktoken_ext.*"]
ignore_missing_imports = true

# proofload is the optional extra, so `mypy` over a plain install has nothing to read and
# would fail on adapter.py's import alone. This silences that one error and nothing else:
# where the extra IS installed, Proofload ships py.typed and mypy checks the adapter
# against the real types, which is the configuration the gate is run in.
[[tool.mypy.overrides]]
module = ["proofload"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
