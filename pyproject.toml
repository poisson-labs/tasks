[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-generator"
version = "0.0.1"
description = "A deterministic generator of tool-use tasks over one mock stateful domain, each generated with its verifier."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
# proofload is Proofload core, installed editable from ../proofload before this package.
# The exact pin keeps pip off the 0.0.0 name-hold on PyPI.
dependencies = ["proofload==0.0.1", "verifiers==0.3.1", "tiktoken==0.14.0"]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "mypy", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/task_generator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["I", "E501", "E702", "B905"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
