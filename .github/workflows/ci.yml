# The fast lane, on every pull request and every push to main, twice: once without Prove and
# once with Prove installed. The job without Prove installs the versions the suite is tested with
# (constraints.txt); the job with Prove installs the newest that the package allows, so a new
# release of any dependency is met there before a user meets it. Each job first checks that Prove is, or is not, importable, so a
# job's name always says what it ran against. It runs ruff, mypy, the two generator hashes, the
# digest and published-content tests, and a wheel built from the tree, installed fresh and
# started on a terminal; the job without Prove then runs the docs' marked blocks from that
# wheel. The whole suite takes over an hour, so it runs in suite.yml, on demand.
#
# A branch runs once, on its pull request and not again on its push, and a new push to the pull
# request cancels the run it supersedes. Both jobs run on a pull request and on a push to main:
# Prove comes from PyPI, so the job with it needs no token.
#
# The steps both jobs share are written once, in the first job, and repeated in the second by
# YAML alias (`*name`).
#
# Third-party actions are pinned to a commit, with the release it is in beside it, and the runner
# image is pinned too: ubuntu-24.04, not a label GitHub moves (tests/test_fx_runner_pinned.py).
# A newer image is a commit of its own, with a run behind it.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# A pull request's run is cancelled when a newer one starts for it. Each push to main is a group
# of its own, so it is never cancelled and every merge keeps its verdict.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  without-prove:
    name: fast lane, without Prove
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tasks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: tasks
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      # The `null` harness launches its program through uv. This is the uv the suite is known
      # green on.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.14"
          enable-cache: false
      # The versions the suite is tested with (constraints.txt), so a dependency's new release
      # cannot turn this job red; the job with Prove installs without them and meets it there.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -c constraints.txt -e ".[dev]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Fetch the reference tokenizer's encoding file
        run: python -m poisson_tasks.fetch_encoding
      - name: Prove is not installed
        run: python -c "import importlib.util, sys; sys.exit(importlib.util.find_spec('poisson_prove') is not None)"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      # The literals tests/test_frozen_generator.py and tests/test_o2b_kept.py hold. A deliberate
      # change to either generator updates its hash there and here.
      - &generator-hashes
        name: The generator hashes
        env:
          BUILT_IN_GENERATOR_HASH: 38a8db83a79c9d42059b77a3ef5ba018ec715fff9dcfda3c146ad27d8ba2921c
          OWN_TOOLS_GENERATOR_HASH: f941d7f8d7ae1694bac834f705c9283471fc65665a467ea9e717a8c6a395933a
        run: |
          python - <<'EOF'
          import os, sys
          from poisson_tasks.arms import arm_from_id
          from poisson_tasks.own import generator as own
          from poisson_tasks.tasks import generate

          built_in = generate(arm_from_id("distractor:r0@k16"), 404).generator_hash
          own_tools = own.generator_hash()
          print(f"built-in generator, version 3: {built_in}")
          print(f"own-tools generator:           {own_tools}")
          moved = [name for name, got in (("built-in", built_in), ("own-tools", own_tools))
                   if got != os.environ[f"{name.upper().replace('-', '_')}_GENERATOR_HASH"]]
          sys.exit(f"the {' and '.join(moved)} generator hash moved" if moved else 0)
          EOF
      # The fifteen files that hold every knob's content digests and the published tasks', and
      # the one that holds the frozen files' bytes and the tool file's contract hash. One
      # process takes about four minutes, most of it making the history and block knobs' tasks,
      # which each process caches for the tests after it. So three processes run side by side,
      # each knob with its kept file: history, block, and everything else. While they run, the
      # step checks that the three together collect exactly the tests one process would, each once.
      - &digest-tests
        name: Digest and published-content tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: |
          all=(tests/test_frozen_generator.py tests/test_k1_hash.py
               tests/test_fd4_published.py tests/test_fd4_pending_published_page.py
               tests/test_k0_published_concurrency.py
               tests/test_k3_kept.py tests/test_k4_kept.py tests/test_k5_kept.py tests/test_k6_kept.py
               tests/test_k7_kept.py tests/test_k8_kept.py tests/test_k8b_kept.py
               tests/test_f2_kept.py tests/test_bd_kept.py
               tests/test_o2b_kept.py tests/test_pv_canonical.py)
          history=(tests/test_frozen_generator.py tests/test_k5_kept.py
                   -k "test_k5_kept or (test_frozen_generator and history)")
          block=(tests/test_frozen_generator.py tests/test_k6_kept.py
                 -k "test_k6_kept or (test_frozen_generator and block)")
          rest=("${all[@]}"
                -k "not test_k5_kept and not test_k6_kept and not (test_frozen_generator and (history or block))")
          python -m pytest -q -p no:cacheprovider "${history[@]}" > "$RUNNER_TEMP/history.log" 2>&1 & history_pid=$!
          python -m pytest -q -p no:cacheprovider "${block[@]}" > "$RUNNER_TEMP/block.log" 2>&1 & block_pid=$!
          python -m pytest -q -p no:cacheprovider "${rest[@]}" > "$RUNNER_TEMP/rest.log" 2>&1 & rest_pid=$!
          failed=0
          ids() { python -m pytest -q -p no:cacheprovider --collect-only "$@" | grep '::' | sort; }
          ids "${all[@]}" > "$RUNNER_TEMP/all.ids"
          { ids "${history[@]}"; ids "${block[@]}"; ids "${rest[@]}"; } | sort > "$RUNNER_TEMP/split.ids"
          diff "$RUNNER_TEMP/all.ids" "$RUNNER_TEMP/split.ids" || failed=1
          echo "$(wc -l < "$RUNNER_TEMP/all.ids") tests, in three processes"
          wait "$history_pid" || failed=1
          wait "$block_pid" || failed=1
          wait "$rest_pid" || failed=1
          for shard in history block rest; do
            echo "--- $shard ---"
            cat "$RUNNER_TEMP/$shard.log"
          done
          exit "$failed"
      - &build-wheel
        name: Build the wheel
        run: |
          python -m pip install build==1.3.0
          python -m build --wheel --outdir "$RUNNER_TEMP/dist"
      - name: Install the wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install -c constraints.txt "$RUNNER_TEMP"/dist/*.whl
      # A bare `poisson-tasks` from the wheel, in an empty folder with its own HOME: on a
      # terminal it shows the first screen and `quit` leaves without writing anything; off a
      # terminal it starts no session.
      - &first-screen
        name: The wheel's first screen
        run: |
          "$RUNNER_TEMP/wheel/bin/python" - "$PWD/pyproject.toml" <<'EOF'
          import os, pty, re, select, subprocess, sys, tempfile, time, tomllib
          from pathlib import Path

          import poisson_tasks

          VERSION = tomllib.loads(Path(sys.argv[1]).read_text())["project"]["version"]
          BIN = str(Path(sys.executable).parent / "poisson-tasks")
          ESCAPE = re.compile(r"\x1b(?:\[[0-9;?]*[ -/]*[@-~]|\][^\x07\x1b]*(?:\x07|\x1b\\)|[@-Z\\-_])")
          failed = []

          def check(ok, what):
              print(f"{'ok  ' if ok else 'FAIL'} {what}", flush=True)
              if not ok:
                  failed.append(what)

          def fresh():
              home = Path(tempfile.mkdtemp())
              folder = home / "project"
              folder.mkdir()
              env = {k: v for k, v in os.environ.items()
                     if k not in ("CI", "NO_COLOR", "FORCE_COLOR", "VIRTUAL_ENV", "PYTHONPATH")}
              env.update(HOME=str(home), TERM="xterm-256color", LANG="C.UTF-8", LC_ALL="C.UTF-8",
                         COLUMNS="100", LINES="50")
              return folder, env

          def text(raw):
              return ESCAPE.sub("", raw.decode("utf-8", "replace")).replace("\r", "")

          check(Path(poisson_tasks.__file__).is_relative_to(Path(sys.prefix)),
                f"poisson_tasks is imported from the wheel's environment ({poisson_tasks.__file__})")

          folder, env = fresh()
          done = subprocess.run([BIN, "--version"], cwd=folder, env=env, stdin=subprocess.DEVNULL,
                                capture_output=True, text=True, timeout=120)
          print(done.stdout.strip())
          check(done.returncode == 0 and done.stdout.startswith(f"poisson-tasks {VERSION} ("),
                f"--version prints {VERSION} and exits 0")

          done = subprocess.run([BIN], cwd=folder, env=env, stdin=subprocess.DEVNULL,
                                capture_output=True, text=True, timeout=120)
          check(done.returncode == 2 and "Enter to start" not in done.stdout + done.stderr,
                "off a terminal it exits 2 and starts no session")
          check(not any(folder.iterdir()), "off a terminal it writes nothing")

          for look in ("pretty", "plain"):
              folder, env = fresh()
              argv = [BIN] + (["--plain"] if look == "plain" else [])
              pid, master = pty.fork()
              if pid == 0:
                  os.chdir(folder)
                  os.execve(BIN, argv, env)
              out, sent, status = b"", False, None
              deadline = time.monotonic() + 90
              while status is None and time.monotonic() < deadline:
                  if select.select([master], [], [], 0.3)[0]:
                      try:
                          out += os.read(master, 65536)
                      except OSError:
                          pass
                  if not sent and "Enter to start, or quit" in text(out):
                      screen = text(out)
                      time.sleep(1.0)
                      os.write(master, b"quit\r")
                      sent = True
                  done_pid, st = os.waitpid(pid, os.WNOHANG)
                  if done_pid:
                      status = os.waitstatus_to_exitcode(st)
              while select.select([master], [], [], 0.2)[0]:
                  try:
                      chunk = os.read(master, 65536)
                  except OSError:
                      break
                  if not chunk:
                      break
                  out += chunk
              if status is None:
                  os.kill(pid, 9)
                  os.waitpid(pid, 0)
              print(f"--- {look} ---\n{text(out)}\n---", flush=True)
              check(sent, f"{look}: the first screen asks `Enter to start, or quit`")
              if sent:
                  check("poisson labs" in screen.lower() and VERSION in screen,
                        f"{look}: it names Poisson Labs and {VERSION}")
                  check("Nothing calls a model until you say yes" in screen,
                        f"{look}: it says nothing calls a model until you say yes")
              check(status == 0 and "Left the session." in text(out),
                    f"{look}: `quit` leaves the session and exits 0")
              check(not any(folder.iterdir()), f"{look}: it writes nothing")

          sys.exit(f"{len(failed)} failed: " + "; ".join(failed) if failed else 0)
          EOF
      # Every `docs-check: run` block of the README and docs/ (CONTRIBUTING.md gives the markers),
      # from the wheel: each page in a folder and a HOME of its own, the paid blocks against the
      # fixture model with a made-up key, and each output block compared with what its block
      # printed. Here only, since the docs are written for an install without Prove. The export
      # page's `uv run eval` needs PyPI.
      - name: The docs' blocks, from the wheel
        run: python scripts/docs_blocks.py --venv "$RUNNER_TEMP/wheel"

  with-prove:
    name: fast lane, with Prove
    # Prove comes from PyPI, through the `prove` extra, so this job needs no token and no second
    # checkout, and it runs wherever the job without Prove does: a change that breaks only with
    # Prove is red on its pull request.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tasks
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: tasks
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.14"
          enable-cache: false
      # Prove from PyPI, through the extra: the newest poisson-prove the extra allows (>=0.1.0),
      # so a new Prove release is met here before a user meets it.
      - name: Install
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -e ".[dev,prove]"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
      - name: Fetch the reference tokenizer's encoding file
        run: python -m poisson_tasks.fetch_encoding
      - name: Prove is installed
        run: python -c "import poisson_prove, importlib.metadata; print('poisson-prove', importlib.metadata.version('poisson-prove'), poisson_prove.__file__)"
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy
      - *generator-hashes
      - *digest-tests
      - *build-wheel
      # The wheel with its extra, so Prove comes from PyPI as a user gets it.
      - name: Install the wheel in a fresh environment
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/python" -m pip install "$(ls "$RUNNER_TEMP"/dist/*.whl)[prove]"
      - *first-screen
      # The documented Prove route from the wheel and PyPI alone, in an environment of its own: the
      # example and the real `poisson-prove` command on the built-in tasks, and Tasks without
      # Prove after it is uninstalled (scripts/release/prove_e2e.py).
      - name: The Prove route, end to end
        run: |
          python scripts/release/prove_e2e.py --wheel "$(ls "$RUNNER_TEMP"/dist/*.whl)" \
            --work "$RUNNER_TEMP/prove-e2e" \
            --tokenizer "$(python -c 'from poisson_tasks.fetch_encoding import ENCODING_PATH; print(ENCODING_PATH)')"
